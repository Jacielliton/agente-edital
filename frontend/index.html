         Open Graph e Twitter: é isto que o WhatsApp, o Telegram, o Instagram
         e o LinkedIn leem para montar a prévia do link.

         cinza, sem título nem imagem — e num produto com programa de
         indicação por comissão, o link compartilhado É o canal de venda.

         A og:image precisa de URL ABSOLUTA (caminho relativo não funciona em
         rede social nenhuma) e de 1200x630 para não ser recortada.
         AO TROCAR DE DOMÍNIO, trocar as três URLs abaixo.
         =================================================================== -->
