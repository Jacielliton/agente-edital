version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: professor_ai_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: agente_edital
    ports:
      # Mapeia a porta 5445 do seu PC para a 5432 do Docker
      # Isso evita conflitos com outros Postgres instalados
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: